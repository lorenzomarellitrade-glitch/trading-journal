<!doctype html>
<html lang="it" data-pal="mono">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="color-scheme" content="dark">
<title>Journal di Lore</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script>try{if(localStorage.getItem("journal-pal")==="verde")document.documentElement.removeAttribute("data-pal")}catch(e){}</script>
<style>
:root{ --bg:#0B0D12; --g1:rgba(255,255,255,.045); --g2:rgba(255,255,255,.07); --line:rgba(255,255,255,.09); --line-hi:rgba(255,255,255,.18); --ink:#EEF0F5; --mute:#9AA1B2; --dim:#5F6678; --acc:#2ECC8A; --acc-ink:#07130C; --acc-soft:rgba(46,204,138,.16); --win:#4ADE80; --loss:#F0616E; --amber:#F2B84B; --shade:rgba(5,6,10,.72); color-scheme:dark;
  --f:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --m:"JetBrains Mono",ui-monospace,Menlo,monospace; --r:16px; }
:root[data-pal="mono"]{ --bg:#0A0A0A; --g1:rgba(255,255,255,.05); --g2:rgba(255,255,255,.09); --line:rgba(255,255,255,.1); --acc:#FFFFFF; --acc-ink:#0A0A0A; --acc-soft:rgba(255,255,255,.12); --win:#A3E635; --loss:#FB7185; --amber:#FDE047; }
:root[data-pal="mono"] body{background-image:radial-gradient(900px 500px at 15% -10%,rgba(255,255,255,.07),transparent 60%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;background:var(--bg);background-image:radial-gradient(900px 500px at 15% -10%,rgba(46,204,138,.14),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(46,204,138,.05),transparent 60%);background-attachment:fixed;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc);text-decoration:none}
.app{max-width:1220px;margin:0 auto}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:22px;padding-block:14px 12px;margin-bottom:20px;border-bottom:1px solid var(--line);background:rgba(11,13,18,.7);backdrop-filter:blur(16px)}
.hd h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap}
.nav{display:flex;gap:2px;flex:1}
.nav a{padding:7px 12px;border-radius:9px;color:var(--mute);font-size:14px;font-weight:500}
.nav a.on{color:var(--ink);background:var(--g2)}
.hd .right{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:var(--acc-ink);font-weight:600;border-radius:10px;padding:9px 16px;font-size:14px;box-shadow:0 6px 20px rgba(46,204,138,.22)}
.cta.ghost{background:var(--g2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.cta.sm{padding:7px 12px;font-size:13px}
.grid{display:grid;gap:16px}
.g-home{grid-template-columns:1.2fr .9fr 1fr}
.g-stats{grid-template-columns:1.3fr 1fr}
.g-cal{grid-template-columns:1.6fr 1fr}
@media(max-width:900px){.g-home,.g-stats,.g-cal{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.blk{background:var(--g1);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.blk.hi{border-color:rgba(46,204,138,.35);background:linear-gradient(180deg,rgba(46,204,138,.09),var(--g1))}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:600;margin-bottom:12px}
.lab span:last-child:not(:first-child){font-size:12px;font-weight:400;color:var(--mute)}
.lab a{font-size:12px;font-weight:500}
.big{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em;font-family:var(--m)}
.big small{font-size:13px;color:var(--mute);font-weight:400;margin-left:6px;font-family:var(--f)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:12px}
.kpi b{display:block;font-size:clamp(18px,2vw,24px);white-space:nowrap;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-family:var(--m)}
.kpi span{font-size:12px;color:var(--mute)}
.kpi.good b{color:var(--win)}
.chart{width:100%;display:block}
.steps{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.steps li:first-child{border-top:0;padding-top:0}
.steps li i{color:var(--dim);font-style:normal;font-size:12px;font-family:var(--m)}
.steps li small{color:var(--mute);font-size:12px}
.steps li .wr{color:var(--win);font-size:12px;white-space:nowrap;font-family:var(--m);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink);background:var(--g1)}
.chips button.on{border-color:var(--acc);color:var(--ink);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.conf{display:flex;flex-direction:column;gap:10px}
.conf div{display:grid;grid-template-columns:1fr 60px 80px;gap:10px;align-items:center;font-size:13px}
.conf div span{color:var(--mute);font-size:12px;text-align:right}
.conf div b{color:var(--win);text-align:right;font-weight:600;font-family:var(--m);font-size:12px}
.conf div.bad b{color:var(--loss)}
.conf .bar{grid-column:1/-1;height:6px;background:var(--g2);border-radius:3px;overflow:hidden;margin-top:-2px}
.conf .bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.conf div.bad .bar i{background:var(--loss)}
.note{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.5}
.quote{border-left:3px solid var(--acc);padding:4px 0 4px 14px;font-size:15px;line-height:1.55;margin:0}
.quote small{display:block;color:var(--mute);font-size:12px;margin-top:6px}
.today{font-size:13px;color:var(--mute)}.today b{color:var(--ink);font-weight:600}
.msg{font-size:13px;color:var(--mute);margin-top:12px}.msg b{color:var(--ink)}.msg.warn b{color:var(--amber)}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;color:var(--dim);text-align:center;padding-bottom:4px;font-weight:500}
.cal .d{aspect-ratio:1.15;border:1px solid var(--line);border-radius:12px;padding:7px 9px;display:flex;flex-direction:column;justify-content:space-between;background:var(--g1);text-align:left;font-size:13px;color:var(--mute);min-width:0;position:relative;transition:background .15s,border-color .15s}
.cal .d:hover{background:var(--g2);border-color:var(--line-hi)}
.cal .d:hover::after{content:"+";position:absolute;top:6px;right:9px;color:var(--acc);font-weight:700}
.cal .d.off{opacity:.22;border-color:transparent;pointer-events:none}
.cal .d.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cal .d.today span{color:var(--acc);font-weight:700}
.cal .d .r{font-size:12px;font-weight:600;font-family:var(--m)}
.cal .d .r.w{color:var(--win)}.cal .d .r.l{color:var(--loss)}
.cal .d .dots{display:flex;gap:3px}.cal .d .dots i{width:6px;height:6px;border-radius:50%;background:var(--amber)}.cal .d .dots i.w{background:var(--win)}.cal .d .dots i.l{background:var(--loss)}
.mnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600}
.mnav button{color:var(--acc);font-weight:500;font-size:13px}
.trades{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--g1);text-align:left;color:var(--ink)}
.tr:hover{background:var(--g2)}
.tr .sym{font-weight:700;font-family:var(--m)}.tr .sym small{display:block;color:var(--mute);font-weight:400;font-size:11px;font-family:var(--f)}
.tr .tags{font-size:12px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .res{font-weight:700;font-family:var(--m);text-align:right}.tr .res.w{color:var(--win)}.tr .res.l{color:var(--loss)}.tr .res.o{color:var(--amber)}
.tr .st{display:block;font-size:11px;color:var(--dim);font-weight:400;font-family:var(--f)}
/* statistiche a grafici */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--g1);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border-radius:8px;padding:7px 12px;color:var(--mute);font-size:13px;font-weight:500}
.seg button.on{color:var(--acc-ink);background:var(--acc)}
.donut{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}
.donut .c{position:relative;width:140px;height:140px}
.donut .c svg{width:140px;height:140px}
.donut .c div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c b{font-size:26px;font-family:var(--m);font-weight:700}.donut .c small{font-size:11px;color:var(--mute)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--mute)}
.legend div{display:flex;justify-content:space-between;align-items:center}
.legend b{font-family:var(--m);color:var(--ink);font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.hb span{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb span small{color:var(--dim);font-size:11px;margin-left:6px}
.hb .track{height:10px;background:var(--g2);border-radius:5px;position:relative;overflow:visible}
.hb .track i{position:absolute;left:0;top:0;height:100%;border-radius:5px;background:var(--acc)}
.hb .track em{position:absolute;top:-3px;width:2px;height:16px;background:var(--mute);border-radius:1px}
.hb b{font-family:var(--m);font-size:12px;font-weight:600;text-align:right}
.hb.bad .track i{background:var(--loss)}.hb.bad b{color:var(--loss)}.hb.good b{color:var(--win)}
.hb.dimmed span,.hb.dimmed b{color:var(--dim)}.hb.dimmed .track i{opacity:.45}
.vbars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;align-items:end;height:150px;padding-top:10px}
.vb{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vb i{width:100%;max-width:64px;border-radius:8px 8px 3px 3px;background:var(--acc)}
.vb.bad i{background:var(--loss)}.vb.good i{background:var(--win)}
.vb b{font-family:var(--m);font-size:12px}
.vb span{font-size:11px;color:var(--mute);text-align:center;line-height:1.2}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-family:var(--m);margin-top:4px}
/* orologio e sessioni */
.clock{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.clock b{font-family:var(--m);font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.clock small{font-size:12px;color:var(--mute)}
.sess{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sess div{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:12px;color:var(--mute)}
.sess div b{color:var(--ink);font-weight:500}
.sess .tr{display:block;height:6px;background:var(--g2);border-radius:3px;position:relative;overflow:hidden;border:0;padding:0}
.sess .tr i{position:absolute;top:0;height:100%;border-radius:3px;background:var(--dim)}
.sess div.on i{background:var(--acc)}.sess div.on b{color:var(--acc)}
.sess div.mine i{background:var(--win)}.sess div.mine b{color:var(--win)}
.sess em{font-style:normal;font-family:var(--m);font-size:11px}
.now{position:absolute;top:-2px;width:2px;height:10px;background:var(--ink)}
/* lista trade */
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tools .seg{width:auto;grid-auto-columns:auto}
.tlist{display:flex;flex-direction:column;gap:8px}
.tlist .tr{grid-template-columns:72px auto 1fr auto}
.thumb{width:72px;height:44px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(135deg,var(--acc-soft),rgba(255,255,255,.04));display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mute);font-family:var(--m)}
.thumb.none{background:var(--g1);color:var(--dim)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tcard{border:1px solid var(--line);border-radius:14px;background:var(--g1);overflow:hidden;text-align:left;color:var(--ink);display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--line-hi);transform:translateY(-2px)}
.tcard .im{aspect-ratio:16/9;background:linear-gradient(135deg,var(--acc-soft),rgba(255,255,255,.03));display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--mute);font-family:var(--m);position:relative}
.tcard .im.none{background:var(--g2);color:var(--dim)}
.tcard .im .res{position:absolute;top:10px;right:10px;font-family:var(--m);font-weight:700;font-size:13px;padding:3px 8px;border-radius:8px;background:rgba(11,13,18,.75)}
.tcard .im .res.w{color:var(--win)}.tcard .im .res.l{color:var(--loss)}.tcard .im .res.o{color:var(--amber)}
.tcard .bd{padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.tcard .bd b{font-family:var(--m)}.tcard .bd small{color:var(--mute);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* nuovo trade: a tutto schermo */
.sheet{position:fixed;inset:0;background:var(--shade);z-index:20;backdrop-filter:blur(10px);overflow:auto;padding:28px 16px}
.sheet .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.5fr .8fr;gap:18px;align-items:start}
@media(max-width:900px){.sheet .in{grid-template-columns:1fr}.sheet aside{position:static}}
.sheet .top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{margin:0;font-size:24px;font-weight:700}
.sheet .sub{font-size:13px;color:var(--mute);margin-top:2px}
.sheet .x{width:38px;height:38px;border-radius:50%;background:var(--g2);border:1px solid var(--line);font-size:18px;line-height:1}
.sheet main{display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet aside{position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
.card{background:rgba(20,23,31,.75);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.35)}
.card h4{margin:0 0 12px;font-size:13px;font-weight:600;display:flex;align-items:center}
.card h4 span{font-size:12px;font-weight:400;color:var(--mute);margin-left:auto}
.card h4 i{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--acc-soft);color:var(--acc);align-items:center;justify-content:center;font-style:normal;font-size:11px;font-family:var(--m);margin-right:8px;vertical-align:middle}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--g1);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:70px;resize:vertical}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute);font-weight:500}
.big2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.big2 button{padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--g1);font-weight:600;font-size:15px;color:var(--mute)}
.big2 button.on{color:var(--ink);border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.big2 button.long.on{border-color:var(--win);box-shadow:inset 0 0 0 1px var(--win);background:rgba(61,214,140,.14)}
.big2 button.short.on{border-color:var(--loss);box-shadow:inset 0 0 0 1px var(--loss);background:rgba(240,97,110,.14)}
.check{display:flex;flex-direction:column;gap:8px}
.check button{display:grid;grid-template-columns:28px 1fr auto;gap:12px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--g1);font-size:14px;font-weight:500;align-items:center;transition:background .15s}
.check button i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--dim);display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:12px}
.check button.on{border-color:rgba(46,204,138,.5);background:var(--acc-soft)}
.check button.on i{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.check button small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.check button em{font-style:normal;font-family:var(--m);font-size:11px;color:var(--dim)}
.prog{height:6px;background:var(--g2);border-radius:3px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .25s}
.addtag{display:flex;gap:8px;margin-top:12px}
.addtag input{font-size:14px}
.drop{border:1px dashed var(--line-hi);border-radius:12px;padding:22px;text-align:center;color:var(--mute);font-size:13px;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--g1);transition:border-color .15s}
.drop:hover{border-color:var(--acc)}
.drop .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%}
.drop .thumbs div{aspect-ratio:16/9;border-radius:10px;border:1px solid var(--line);background:linear-gradient(135deg,var(--acc-soft),rgba(255,255,255,.04));display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--ink);font-family:var(--m)}
.drop kbd{font-family:var(--m);font-size:12px;border:1px solid var(--line-hi);border-radius:6px;padding:2px 7px;color:var(--ink)}
.states{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.states button{padding:12px 10px;border-radius:12px;border:1px solid var(--line);background:var(--g1);font-weight:500;font-size:13px;color:var(--mute);text-align:left}
.states button.on{color:var(--ink);border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.states button small{display:block;font-size:11px;color:var(--dim);font-weight:400}
.sum{display:flex;flex-direction:column;gap:10px;font-size:13px}
.sum div{display:flex;justify-content:space-between;gap:10px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.sum div:first-child{border-top:0;padding-top:0}
.sum b{color:var(--ink);text-align:right;font-weight:600;font-family:var(--m)}
.sum .ok{color:var(--win)}.sum .no{color:var(--amber)}
.acts{display:flex;flex-direction:column;gap:8px}
.acts .cta{width:100%;padding:12px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;font-weight:500}
.enter{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- aggiunte della versione vera ---- */
:root[data-pal="mono"] .cta{box-shadow:none}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--g1);backdrop-filter:blur(14px)}
.login h1{margin:0 0 4px;font-size:22px}.login p{margin:0 0 10px;color:var(--mute);font-size:13px}
.login input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line-hi);background:var(--g2);color:var(--ink);font:inherit;font-size:15px}
.login .err{color:var(--loss);font-size:13px;min-height:18px}
.gear{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--g1);color:var(--ink);font-size:16px}
.pop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:64px;z-index:20;width:260px;padding:14px;border:1px solid var(--line-hi);border-radius:14px;background:rgba(14,16,22,.96);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pop .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pop .seg{width:100%}
.pop .who{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .st{font-size:12px;color:var(--mute)}
.thumb img,.tcard .im img,.gal img,.drop .thumbs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb,.gal a,.drop .thumbs div{position:relative}
.tcard .im{position:relative;padding:0}
.tcard .im span.tag{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--mute);font-family:var(--m)}
.thumb{overflow:hidden;padding:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gal a{display:block;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--g2)}
.gal .ph{display:grid;place-items:center;font-size:12px;color:var(--mute);text-align:center;padding:10px}
.drop .thumbs div{position:relative;overflow:hidden;padding:0}
.drop .thumbs div button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:14px;border:1px solid rgba(255,255,255,.3)}
.drop input[type=file]{display:none}
.danger{color:var(--loss)!important;border-color:rgba(240,97,110,.4)!important}
.busy{opacity:.6;pointer-events:none}
.empty{padding:26px 10px;text-align:center;color:var(--mute);font-size:13px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h1>Journal</h1><p>Solo tu. Entra con la mail del journal.</p>
    <input type="email" id="email" placeholder="mail" autocomplete="username" required>
    <input type="password" id="password" placeholder="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="cta" type="submit" id="loginBtn">Entra</button>
  </form>
</div>
<div class="app" id="app" hidden>
  <header class="hd">
    <h1>Journal</h1>
    <nav class="nav" id="nav"><a href="#home" data-v="home">Home</a><a href="#calendario" data-v="calendario">Calendario</a><a href="#trade" data-v="trade">Trade</a><a href="#statistiche" data-v="statistiche">Statistiche</a></nav>
    <div class="right"><span id="hdDate"></span><button class="cta" id="newBtn" type="button">+ Nuovo trade</button><button class="gear" id="gearBtn" type="button" aria-label="Impostazioni">⚙</button></div>
  </header>
  <main id="view"></main>
</div>
<div class="pop" id="pop" hidden>
  <div class="lab">Colore</div>
  <div class="seg"><button type="button" data-pal="mono">Mono</button><button type="button" data-pal="verde">Verde</button></div>
  <div class="lab">Archivio</div>
  <div class="st" id="syncSt">—</div>
  <div class="who" id="who"></div>
  <button type="button" class="cta ghost sm" id="logoutBtn">Esci</button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=1793889724"></script>
<script src="logica.js?v=1793889724"></script>
<script src="app.js?v=1793889724"></script>
</body>
</html>
